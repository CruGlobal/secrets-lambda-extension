name: Test

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Vet, test and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      # The release binary is static, so build it the same way to catch anything that needs cgo.
      - name: Build
        run: CGO_ENABLED=0 go build -o /dev/null .
